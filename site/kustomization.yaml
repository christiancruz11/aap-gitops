apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - site-config.yaml
  - ../base/operator
  - ../base/cnpg
  - ../base/secrets
  - ../base/platform

# ============================================================
#  String replacements — sourced from site-config.yaml
#  (no need to edit below, values come from site-config.yaml)
# ============================================================
replacements:
  # -- Namespace: sets metadata.name, metadata.namespace, and OperatorGroup target --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.NAMESPACE
    targets:
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.name
      - select: {}
        reject:
          - kind: Namespace
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: OperatorGroup
        fieldPaths:
          - spec.targetNamespaces.0
      - select:
          kind: SecretStore
        fieldPaths:
          - spec.provider.kubernetes.remoteNamespace

  # -- AAP instance name --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.INSTANCE_NAME
    targets:
      - select:
          kind: AnsibleAutomationPlatform
        fieldPaths:
          - metadata.name

  # -- Postgres replicas --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_INSTANCES
    targets:
      - select:
          kind: Cluster
          group: postgresql.cnpg.io
        fieldPaths:
          - spec.instances

  # -- Postgres storage size --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_STORAGE_SIZE
    targets:
      - select:
          kind: Cluster
          group: postgresql.cnpg.io
        fieldPaths:
          - spec.storage.size

  # -- Postgres cluster name --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_CLUSTER_NAME
    targets:
      - select:
          kind: Cluster
          group: postgresql.cnpg.io
        fieldPaths:
          - metadata.name
      - select:
          kind: Database
          group: postgresql.cnpg.io
        fieldPaths:
          - spec.cluster.name

  # -- AAP operator channel --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.AAP_CHANNEL
    targets:
      - select:
          kind: Subscription
        fieldPaths:
          - spec.channel

  # -- Hub storage class --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.HUB_STORAGE_CLASS
    targets:
      - select:
          kind: AnsibleAutomationPlatform
        fieldPaths:
          - spec.hub.file_storage_storage_class

  # -- Postgres service host --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_HOST
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - spec.target.template.data.host

  # -- CNPG app secret name (auto-created by CNPG) --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_APP_SECRET
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - spec.data.0.remoteRef.key
          - spec.data.1.remoteRef.key

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ============================================================
#  Must match NAMESPACE in site-config.yaml
# ============================================================
namespace: aap-cc

resources:
  - site-config.yaml
  - ../base/operator
  - ../base/cnpg
  - ../base/platform

# ============================================================
#  Numeric / quantity values (edit here if needed)
# ============================================================
patches:
  - target:
      kind: Cluster
      group: postgresql.cnpg.io
    patch: |
      - op: replace
        path: /spec/instances
        value: 2              # Number of Postgres replicas
      - op: replace
        path: /spec/storage/size
        value: 50Gi           # Postgres storage size

# ============================================================
#  String replacements — sourced from site-config.yaml
#  (no need to edit below, values come from site-config.yaml)
# ============================================================
replacements:
  # -- Namespace name + OperatorGroup target --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.NAMESPACE
    targets:
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.name
      - select:
          kind: OperatorGroup
        fieldPaths:
          - spec.targetNamespaces.0

  # -- AAP instance name --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.INSTANCE_NAME
    targets:
      - select:
          kind: AnsibleAutomationPlatform
        fieldPaths:
          - metadata.name

  # -- Postgres cluster name --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.PG_CLUSTER_NAME
    targets:
      - select:
          kind: Cluster
          group: postgresql.cnpg.io
        fieldPaths:
          - metadata.name
      - select:
          kind: Database
          group: postgresql.cnpg.io
        fieldPaths:
          - spec.cluster.name

  # -- AAP operator channel --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.AAP_CHANNEL
    targets:
      - select:
          kind: Subscription
        fieldPaths:
          - spec.channel

  # -- Hub storage class --
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.HUB_STORAGE_CLASS
    targets:
      - select:
          kind: AnsibleAutomationPlatform
        fieldPaths:
          - spec.hub.file_storage_storage_class

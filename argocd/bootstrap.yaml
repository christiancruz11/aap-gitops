apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap-argocd-apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://REPLACE_WITH_YOUR_REPO_URL.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

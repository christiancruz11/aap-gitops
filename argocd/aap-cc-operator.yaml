apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap-cc-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://REPLACE_WITH_YOUR_REPO_URL.git
    targetRevision: main
    path: operators/aap-cc
  destination:
    server: https://kubernetes.default.svc
    namespace: aap-cc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
